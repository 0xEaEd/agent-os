name: Desktop Release Assets

# Builds, signs, notarizes and publishes the macOS desktop app for a
# `v<CalVer>` release tag: the dmg/zip pairs (arm64 and x64) plus
# `latest-mac.yml` go on that GitHub release, which is marked Latest, and the
# running app's electron-updater reads the Latest release for the next
# version. The upload is done with gh rather than by electron-builder, which
# would name the release after the app's semver twin instead.
#
# Two ways in:
#   - push a `v*` tag to this repository;
#   - "Run workflow" with the tag to release to (and, optionally, the git ref
#     to build from and the repository whose release receives the assets).
#
# The desktop code lives in this repository while the Python releases (and
# the `publish` block in desktop/electron-builder.yml) live under
# use-agent-os/agent-os. Publishing to another repository needs a token that
# can write its releases; the built app's `app-update.yml` is pointed at
# whichever repository actually received the assets, so a build never looks
# for updates where they were not uploaded.
#
# Required repository secrets (Settings › Secrets and variables › Actions):
#   MAC_CSC_LINK                 base64 of the "Developer ID Application" .p12
#   MAC_CSC_KEY_PASSWORD         the .p12 password
#   APPLE_ID                     Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
#   APPLE_TEAM_ID                the 10-character team id
# Optional:
#   DESKTOP_RELEASE_TOKEN        fine-grained PAT with "Contents: write" on the
#                                target repository, when it is not this one.
# Without the signing secrets the build still runs (ad-hoc signed, not
# notarized) and is kept as a workflow artifact only: Gatekeeper and
# electron-updater would both refuse it, so it is never published.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to (e.g. v2026.9.22.post1)
        required: true
      ref:
        description: Git ref to build from (defaults to the tag)
        required: false
        default: ""
      repo:
        description: Repository whose release receives the assets (owner/name)
        required: false
        default: use-agent-os/agent-os

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
  BUILD_REF: ${{ github.event_name == 'push' && github.ref_name || (github.event.inputs.ref != '' && github.event.inputs.ref || github.event.inputs.tag) }}
  # A pushed tag releases into the repository it was pushed to; a manual run
  # names its target (default use-agent-os/agent-os, where the wheel lives).
  TARGET_REPO: ${{ github.event_name == 'push' && github.repository || github.event.inputs.repo }}

jobs:
  build-desktop:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+.*$ ]]; then
            echo "Release tag must look like v2026.9.12: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ ! "${TARGET_REPO}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Target repository must be owner/name: ${TARGET_REPO}" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.BUILD_REF }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - name: Check the app version matches the tag
        run: |
          app_version="$(node -p "require('./desktop/package.json').version")"
          if [[ "v${app_version}" != "${RELEASE_TAG}" ]]; then
            echo "desktop/package.json is ${app_version} but the tag is ${RELEASE_TAG}." >&2
            echo "Run the pump-version skill so every version file agrees." >&2
            exit 1
          fi

      # The desktop renderer imports the web console's transport and chat
      # logic from frontend/src, so the console's dependencies must be there.
      - name: Install console dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Quality gate
        working-directory: desktop
        run: npm run check

      - name: Decide whether signing secrets are present
        id: signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing/notarization secrets are missing (${missing[*]}): building an unpublished, ad-hoc signed app."
          fi

      # electron-builder publishes with GH_TOKEN. The job's own token only
      # writes this repository's releases; another repository needs the PAT.
      - name: Pick the token that can write ${{ env.TARGET_REPO }}
        id: token
        if: steps.signing.outputs.enabled == 'true'
        env:
          PAT: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
        run: |
          if [[ -n "${PAT}" ]]; then
            echo "source=DESKTOP_RELEASE_TOKEN" >> "$GITHUB_OUTPUT"
          elif [[ "${TARGET_REPO}" == "${GITHUB_REPOSITORY}" ]]; then
            echo "source=GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing to ${TARGET_REPO} from ${GITHUB_REPOSITORY} needs the DESKTOP_RELEASE_TOKEN secret" >&2
            echo "(a fine-grained PAT with Contents: write on ${TARGET_REPO}), or pass repo=${GITHUB_REPOSITORY}." >&2
            exit 1
          fi

      # The assets are uploaded onto the CalVer release. On another repository
      # the Python release must already exist; on this one it is created from
      # the built commit so a dispatch works before the tag is pushed.
      - name: Ensure the release exists on ${{ env.TARGET_REPO }}
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.source == 'DESKTOP_RELEASE_TOKEN' && secrets.DESKTOP_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${TARGET_REPO}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} exists on ${TARGET_REPO}."
            exit 0
          fi
          if [[ "${TARGET_REPO}" == "${GITHUB_REPOSITORY}" ]]; then
            gh release create "${RELEASE_TAG}" --repo "${TARGET_REPO}" --target "${GITHUB_SHA}" \
              --title "AgentOS ${RELEASE_TAG#v}" --notes "AgentOS for Mac ${RELEASE_TAG#v}." --latest=false
          else
            echo "No release ${RELEASE_TAG} on ${TARGET_REPO}; the Python release has to exist first." >&2
            exit 1
          fi

      # electron-builder can import CSC_LINK into a temporary keychain itself,
      # but app-builder-lib 26 hands `security set-key-partition-list -k` the
      # certificate's password instead of that keychain's, and the macOS 26
      # runner image validates it: "SecKeychainUnlock: The user name or
      # passphrase you entered is not correct". Build the signing keychain
      # here, with the right password in each command, and hand it over
      # through CSC_KEYCHAIN; CSC_LINK never reaches the packaging step.
      - name: Import the Developer ID certificate into a build keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/agentos-release.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          # Accept a bare base64 blob or a data: URL.
          printf '%s' "${MAC_CSC_LINK#*base64,}" | tr -d '\r\n' | base64 -d > "$certificate"
          test -s "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          # Search list: the build keychain first, then whatever was there.
          security list-keychains -d user | sed 's/^ *"//; s/"$//' | xargs security list-keychains -d user -s "$keychain"
          rm -f "$certificate"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        if: steps.signing.outputs.enabled == 'true'
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          owner="${TARGET_REPO%%/*}"
          repo="${TARGET_REPO##*/}"
          # electron-builder and electron-updater only speak semver, and the
          # CalVer in package.json (2026.9.22.post1) is not one; the packaged
          # app carries its semver twin as `version` and the CalVer as
          # `calver` (scripts/release-version.mjs, shared/updates.ts).
          semver="$(node scripts/release-version.mjs)"
          calver="$(node scripts/release-version.mjs --calver)"
          echo "Packaging ${calver} as ${semver}"
          npm run build
          # `--publish never`: electron-builder would name the release after
          # the semver twin (v2026.922.1) and create it itself; the assets
          # belong on the CalVer tag next to the Python wheel, so the upload
          # step below does it with gh. The publish overrides still land in
          # the bundled app-update.yml and in latest-mac.yml, so the shipped
          # app checks the repository that holds its updates.
          npx electron-builder --mac --config electron-builder.yml --publish never \
            -c.publish.owner="${owner}" -c.publish.repo="${repo}" \
            -c.extraMetadata.version="${semver}" -c.extraMetadata.calver="${calver}"

      - name: Verify the signed bundle
        if: steps.signing.outputs.enabled == 'true'
        working-directory: desktop
        run: |
          set -euo pipefail
          for app in release/mac-arm64/AgentOS.app release/mac/AgentOS.app; do
            [[ -d "$app" ]] || continue
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dvv "$app" 2>&1 | grep -E "Authority=Developer ID Application" >/dev/null \
              || { echo "$app is not signed with a Developer ID identity" >&2; exit 1; }
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            grep -q "owner: ${TARGET_REPO%%/*}" "$app/Contents/Resources/app-update.yml"
          done
          echo "== latest-mac.yml"
          cat release/latest-mac.yml
          # Artifacts are named after the semver twin. electron-builder names
          # the x64 zip without an arch suffix and the arm64 one with it; the
          # updater needs both listed.
          semver="$(node scripts/release-version.mjs)"
          grep -q "^version: ${semver}$" release/latest-mac.yml \
            || { echo "latest-mac.yml is not for ${semver}" >&2; exit 1; }
          grep -q "url: AgentOS-${semver}-arm64-mac.zip" release/latest-mac.yml \
            || { echo "latest-mac.yml does not list the arm64 zip" >&2; exit 1; }
          grep -q "url: AgentOS-${semver}-mac.zip" release/latest-mac.yml \
            || { echo "latest-mac.yml does not list the x64 zip" >&2; exit 1; }
          for app in release/mac-arm64/AgentOS.app release/mac/AgentOS.app; do
            [[ -d "$app" ]] || continue
            [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" == "${semver}" ]] \
              || { echo "$app is not versioned ${semver}" >&2; exit 1; }
            # Plain Node cannot read inside an asar; extract the manifest into
            # a scratch directory (extract-file writes to the cwd).
            scratch="$(mktemp -d)"
            asar="$(pwd)/node_modules/.bin/asar"
            (cd "$scratch" && "$asar" extract-file "$OLDPWD/$app/Contents/Resources/app.asar" package.json)
            [[ "$(node -p "require('$scratch/package.json').calver")" == "${RELEASE_TAG#v}" ]] \
              || { echo "$app does not carry calver ${RELEASE_TAG#v}" >&2; exit 1; }
            rm -rf "$scratch"
          done

      # electron-updater asks GitHub for the release marked *Latest* and reads
      # latest-mac.yml from its assets, whatever the tag is called; so the
      # assets go on the CalVer release and that release is marked Latest
      # unless a newer CalVer is already published.
      - name: Publish the assets to ${{ env.TARGET_REPO }}
        if: steps.signing.outputs.enabled == 'true'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ steps.token.outputs.source == 'DESKTOP_RELEASE_TOKEN' && secrets.DESKTOP_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" --repo "${TARGET_REPO}" --clobber \
            release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml
          current="$(gh release view --repo "${TARGET_REPO}" --json tagName --jq .tagName 2>/dev/null || true)"
          newest="$(printf '%s\n%s\n' "${current#v}" "${RELEASE_TAG#v}" | sort -V | tail -1)"
          if [[ -z "${current}" || "${newest}" == "${RELEASE_TAG#v}" ]]; then
            gh release edit "${RELEASE_TAG}" --repo "${TARGET_REPO}" --latest
            echo "${RELEASE_TAG} is now the latest release on ${TARGET_REPO}."
          else
            echo "::warning::${current} stays the latest release; ${RELEASE_TAG} is older, so installed apps will not be offered it."
          fi
          gh release view "${RELEASE_TAG}" --repo "${TARGET_REPO}" --json assets --jq '.assets[].name'

      - name: Build without publishing (no signing secrets)
        if: steps.signing.outputs.enabled != 'true'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build
          npx electron-builder --mac --config electron-builder.yml --publish never

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentos-desktop-${{ env.RELEASE_TAG }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "## AgentOS for Mac ${RELEASE_TAG}"
            echo
            echo "- built from \`${BUILD_REF}\`"
            if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
              echo "- signed, notarized and published to https://github.com/${TARGET_REPO}/releases/tag/${RELEASE_TAG}"
            else
              echo "- **not published**: signing secrets missing; the ad-hoc build is attached as a workflow artifact"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
